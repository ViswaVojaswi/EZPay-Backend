status = warn
name = EzPayLogging

property.logDir = logs
property.logPattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %c{1} - %msg%n

appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${logPattern}

appender.file.type = RollingFile
appender.file.name = FileAppender
appender.file.fileName = ${logDir}/ezpay.log
appender.file.filePattern = ${logDir}/ezpay-%d{yyyy-MM-dd}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${logPattern}
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10

rootLogger.level = info
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = FileAppender

logger.userManagement.name = com.ezpay.usermanagement
logger.userManagement.level = debug
logger.userManagement.additivity = false
logger.userManagement.appenderRefs = console, file
logger.userManagement.appenderRef.console.ref = ConsoleAppender
logger.userManagement.appenderRef.file.ref = FileAppender
